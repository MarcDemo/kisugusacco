{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card border-0 shadow-sm">
        <div class="card-header bg-success text-white">
          <h3 class="h5 mb-0"><i class="bi bi-key me-2"></i>Change Password</h3>
        </div>
        <div class="card-body p-4">
          <p class="text-muted">Enter your current password, then choose and confirm your new password.</p>
          <form method="post" novalidate>
            {% csrf_token %}
            {{ form|crispy }}
            <div class="d-flex gap-2 mt-4">
              <button class="btn btn-success" type="submit">Change Password</button>
              <a class="btn btn-outline-secondary" href="{% url 'my_profile' %}">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
